<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- El sello del atlas: el campo del ocular con una celula teñida en H&E.
       La entrega del sistema de diseño traia las clases i/e/f sin la hoja de
       estilo que las pinta, asi que el icono salia en negro; aqui se escribe
       con los valores que su propio README fija para cada tema. -->
  <style>
    .i { stroke: #1c1a16 }
    .e { fill: #c2365f }
    .f { fill: #1c1a16 }
    @media (prefers-color-scheme: dark) {
      .i { stroke: #f1ede1 }
      .e { fill: #e0688a }
      .f { fill: #f1ede1 }
    }
  </style>
  <circle class="i" cx="16" cy="16" r="12.5" fill="none" stroke-width="3"></circle>
  <ellipse class="e" cx="16" cy="16" rx="8.2" ry="5.3" transform="rotate(-35 16 16)"></ellipse>
  <circle class="f" cx="18.3" cy="14.4" r="2.7"></circle>
</svg>
